<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FADE WIN - Tap & Win</title>
<meta name="monetag" content="c572032c2c1d4d3367fce7ba639a20da">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;}
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:white;}
.game-box{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:28px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
h1{font-size:32px;margin-bottom:6px;background:linear-gradient(90deg,#FFD700,#FFA500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stats{display:flex;justify-content:space-between;margin-bottom:20px;gap:10px;}
.stat{background:rgba(255,255,255,0.1);border-radius:14px;padding:12px;flex:1;}
.stat-value{font-size:22px;font-weight:800;margin-top:4px;}
.tap-area{width:180px;height:180px;background:radial-gradient(circle at 30% 30%,#FFD700,#FF8C00);border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:52px;cursor:pointer;box-shadow:0 10px 30px rgba(255,215,0,0.4);transition:transform 0.08s;}
.tap-area:active{transform:scale(0.92);}
.progress-wrap{background:rgba(255,255,255,0.1);height:10px;border-radius:10px;overflow:hidden;margin:16px 0;}
.progress-bar{height:100%;background:linear-gradient(90deg,#FFD700,#FFA500);width:0%;transition:width 0.3s;}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:12px;}
.btn-bonus{background:linear-gradient(90deg,#00F5A0,#00D9FF);color:#000;}
.btn-bonus:disabled{opacity:0.4;}
</style>
</head>
<body>
<div class="game-box">
<h1>FADE WIN</h1>
<p style="opacity:0.7;font-size:14px;margin-bottom:12px;">Tap to earn • Bonus x2</p>
<div class="stats">
<div class="stat"><div style="font-size:11px;opacity:0.6">POINTS</div><div class="stat-value" id="points">0</div></div>
<div class="stat"><div style="font-size:11px;opacity:0.6">TAPS</div><div class="stat-value" id="taps">0</div></div>
<div class="stat"><div style="font-size:11px;opacity:0.6">PER TAP</div><div class="stat-value" id="perTap">+1</div></div>
</div>
<div class="tap-area" id="tapArea">💰</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div style="font-size:13px;opacity:0.7"><span id="tapsToBonus">25</span> taps to bonus</div>
<button class="btn btn-bonus" id="bonusBtn" disabled>🎁 CLAIM BONUS x2</button>
<button class="btn" style="background:rgba(255,255,255,0.1);color:white;font-size:13px;padding:10px;margin-top:16px;" onclick="resetGame()">Reset</button>
</div>
<script>
let points=parseInt(localStorage.getItem('fade_points')||'0'),taps=parseInt(localStorage.getItem('fade_taps')||'0'),level=parseInt(localStorage.getItem('fade_level')||'1'),perTap=level,tapsSinceBonus=parseInt(localStorage.getItem('fade_tapsSinceBonus')||'0');
const pointsEl=document.getElementById('points'),tapsEl=document.getElementById('taps'),perTapEl=document.getElementById('perTap'),tapArea=document.getElementById('tapArea'),progressBar=document.getElementById('progressBar'),tapsToBonusEl=document.getElementById('tapsToBonus'),bonusBtn=document.getElementById('bonusBtn');
function updateUI(){pointsEl.textContent=points;tapsEl.textContent=taps;perTapEl.textContent='+'+perTap;let progress=(tapsSinceBonus/25)*100;progressBar.style.width=Math.min(progress,100)+'%';let remaining=25-tapsSinceBonus;if(remaining<=0){bonusBtn.disabled=false;bonusBtn.textContent='🎁 CLAIM BONUS x2 READY!';}else{bonusBtn.disabled=true;bonusBtn.textContent='🎁 CLAIM BONUS x2 (Watch Ad)';tapsToBonusEl.textContent=remaining;}localStorage.setItem('fade_points',points);localStorage.setItem('fade_taps',taps);localStorage.setItem('fade_level',level);localStorage.setItem('fade_tapsSinceBonus',tapsSinceBonus);}
tapArea.addEventListener('click',()=>{taps++;tapsSinceBonus++;points+=perTap;if(taps%50===0){level++;perTap=level;}updateUI();});
bonusBtn.addEventListener('click',()=>{points=points*2;tapsSinceBonus=0;updateUI();alert('Bonus! Points doubled! 🎉 - After Monetag approval, ad will show here');});
function resetGame(){if(confirm('Reset?')){points=0;taps=0;level=1;perTap=1;tapsSinceBonus=0;localStorage.clear();updateUI();}}
updateUI();
</script>
<!-- PASTE MONETAG AD ZONE CODES HERE AFTER VERIFICATION -->
</body>
</html>
